# ===============================
# Shared config (safe to commit - no secrets here)
# ===============================
spring.application.name=nrc-api
server.port=8090

# Profile-specific DB/JWT/CORS config lives in application-<profile>.properties.
# See application-local.properties.example for the keys a new profile needs.
spring.profiles.active=local

# ===============================
# JPA / HIBERNATE CONFIG (matches nrcadmin/KABHI conventions)
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JACKSON / MVC CONFIG
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# ===============================
# INFRASTRUCTURE MODULE - PHOTO STORAGE
# ===============================
# Relative to the app's working directory when no file-storage convention
# existed in this codebase before (confirmed - grepped for MultipartFile/
# multipart usage, found none). Local disk, not a static resource mapping -
# photos are served through an authenticated endpoint (InfrastructureController),
# same JWT gate as every other endpoint, not a public folder.
nrc.uploads.dir=uploads/infrastructure
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
